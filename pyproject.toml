[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "context-middleware"
version = "0.1.0"
description = "CPU-first, extractive context optimization middleware for RAG pipelines."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "pysbd>=0.3.4",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
ingest = ["markitdown[all]>=0.1"]
# Offline FP32 -> INT8 conversion only (context_middleware.quantization).
quantize = ["onnx>=1.16"]
# Level 2 evaluation only (evaluation/llm_clients.py); local Qwen needs Ollama.
llm = ["anthropic>=2.3"]
dev = ["pytest>=8", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_middleware"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests", "evaluation"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "markitdown.*", "pysbd.*"]
ignore_missing_imports = true
